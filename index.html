<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Rahasia Buat Ayya</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe4e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 90%;
        }

        h1 { color: #ff4d6d; }
        p { color: #555; font-size: 1.1em; }

        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-weight: bold;
        }

        button:hover {
            background-color: #ff758f;
            transform: scale(1.05);
        }

        #camera-container {
            display: none;
            margin-top: 20px;
        }

        video {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            border: 5px solid #ff4d6d;
            transform: scaleX(-1); /* Biar kayak cermin */
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="setup">
            <h1>Coba Tebak! 🎀</h1>
            <p>Tau gak siapa cewek paling <strong>tergemoy maksimal</strong> sedunia?</p>
            <p>Ayya mau liat orangnya? Klik tombol di bawah!</p>
            <button onclick="bukaKamera()">Lihat Si Tergemoy 😍</button>
        </div>

        <div id="camera-container">
            <h1>TADAAA! ✨</h1>
            <p>Tuh kan, beneran paling gemoy!</p>
            <video id="video" autoplay playsinline></video>
            <p style="font-style: italic; font-size: 0.8em; margin-top: 10px;">(Terciduk kamera karena terlalu cantik)</p>
        </div>
    </div>

    <script>
        async function bukaKamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                const setup = document.getElementById('setup');
                const container = document.getElementById('camera-container');

                video.srcObject = stream;
                setup.classList.add('hidden');
                container.style.display = 'block';
            } catch (err) {
                alert("Yah, kameranya gak dapet izin. Tapi tetep kamu kok yang paling gemoy!");
                console.error("Error akses kamera: ", err);
            }
        }
    </script>
</body>
</html>
